<!doctype html>
<html lang="en" data-labs-glass="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AgentFit · when should a workflow get an agent?</title>
    <meta
      name="description"
      content="AgentFit scores economic opportunity, technical readiness, controllability, and risk before anyone writes an orchestration graph. Local-first, deterministic, no account required."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgentFit — when should a workflow get an agent?" />
    <meta
      property="og:description"
      content="Scores economics, reversibility, system access, and autonomy before anyone writes an orchestration graph."
    />
    <meta property="og:url" content="https://agent-fit2.vercel.app/" />
    <meta property="og:image" content="https://agent-fit2.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1611" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the stored theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem('agentfit.theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      AgentFit is an interactive decision model and needs JavaScript. The methodology it implements
      is described at github.com/johnjayasankar-afk/agentfit.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
