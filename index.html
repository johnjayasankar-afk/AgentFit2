<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AgentFit — when should a workflow get an agent?</title>
    <meta
      name="description"
      content="AgentFit scores economic opportunity, technical readiness, controllability, and risk before anyone writes an orchestration graph. Local-first, deterministic, no account required."
    />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the stored theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem('agentfit.theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      AgentFit is an interactive decision model and needs JavaScript. The methodology it implements
      is described at github.com/johnjayasankar-afk/agentfit.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
